name: Gonggi iOS idle-duplicate guard check

# One-off validation of branch fix/idle-duplicate-photo-guard: simulator compile + unit tests, and the same full test
# command on the baseline commit 830fa89 (TestFlight 2.0 (92)) to tell pre-existing failures from new ones.
# No archive, export, TestFlight or ASC upload, no build-number change. OpenCV xcframework comes from the main-branch cache;
# a cache miss fails the run instead of rebuilding OpenCV.
on:
  workflow_dispatch:
  # A new workflow file cannot be dispatched before it exists on the default branch: one run is started by the push that
  # changes this file on this branch only.
  push:
    branches: [fix/idle-duplicate-photo-guard]
    paths: [".github/workflows/gonggi-ios-idle-guard-check.yml"]

permissions:
  contents: read

env:
  PROJECT: Gonggi.xcodeproj
  SCHEME: Gonggi
  OPENCV_VERSION: "4.10.0"

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: macos-15
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: branch
            ref: ${{ github.sha }}
          - name: baseline-830fa89
            ref: 830fa8910fb18e0a4655641fde2b1f39cd616141
    steps:
      - name: Checkout ${{ matrix.name }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Restore OpenCV xcframework (cache only)
        uses: actions/cache/restore@v4
        with:
          path: Vendor/OpenCV/opencv2.xcframework
          key: opencv-${{ env.OPENCV_VERSION }}-ios17-arm64-simarm64-minimal-v1
          fail-on-cache-miss: true

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)"
          echo "DEVELOPER_DIR=${XCODE_APP}/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          git rev-parse HEAD

      - name: Install XcodeGen and generate project
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      - name: Resolve simulator
        id: sim
        run: |
          set -euo pipefail
          UDID="$(python3 <<'PY'
          import json, subprocess, sys
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"], text=True))
          for rt in sorted([k for k in data.get("devices", {}) if "iOS" in k], reverse=True):
              ds = [d for d in data["devices"][rt] if d.get("isAvailable") and "iPhone" in d.get("name", "")]
              ds.sort(key=lambda d: d.get("name", ""))
              if ds:
                  print(ds[0]["udid"]); sys.exit(0)
          sys.exit(1)
          PY
          )"
          echo "udid=${UDID}" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "${UDID}" || true

      - name: Build for testing (compile app + tests)
        run: |
          set -euo pipefail
          set +e
          xcodebuild build-for-testing \
            -project "${PROJECT}" -scheme "${SCHEME}" -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO EXCLUDED_ARCHS=x86_64 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          set -e
          grep -E "error:|fatal error:|undefined symbol" build.log | tail -n 60 || true
          exit "${STATUS}"

      - name: Boot simulator
        run: xcrun simctl boot "${{ steps.sim.outputs.udid }}" 2>/dev/null || true

      - name: Targeted tests incl. V1_036 diagnostics (branch only)
        if: matrix.name == 'branch'
        run: |
          set -euo pipefail
          set +e
          xcodebuild test-without-building \
            -project "${PROJECT}" -scheme "${SCHEME}" -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -only-testing:GonggiTests/IdleDuplicateGuardTests \
            -only-testing:GonggiTests/CaptureBridgePolicyTests \
            -only-testing:GonggiTests/CaptureBridgeReplayTests \
            -only-testing:GonggiTests/AdaptiveKeyframeTF62Tests \
            -only-testing:GonggiTests/PendingAngularRescueTests \
            -only-testing:GonggiTests/ReanchorAfterStallTests \
            -only-testing:GonggiTests/SpatialCapturePackageTests \
            -only-testing:GonggiTests/CaptureDataFoundationTests \
            -only-testing:GonggiTests/ObjectCaptureTests \
            -only-testing:GonggiTests/ObjectProductEvidenceTests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee targeted.log
          STATUS=${PIPESTATUS[0]}
          set -e
          grep -E "Test Suite '.*' (passed|failed)|error:|failed \(|Executed [0-9]+ tests" targeted.log | tail -n 80 || true
          echo "===== V1_036 reports ====="
          awk '/V1_036_SWIFT_VS_PYTHON|V1_036_GUARD_DIAG/ {p=1} p {print} /^}$/ {p=0}' targeted.log | head -n 400
          exit "${STATUS}"

      - name: Full GonggiTests (same command on both commits)
        if: always()
        continue-on-error: true
        run: |
          set +e
          xcodebuild test-without-building \
            -project "${PROJECT}" -scheme "${SCHEME}" -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -only-testing:GonggiTests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee full.log
          STATUS=${PIPESTATUS[0]}
          grep -E "Executed [0-9]+ tests, with" full.log | tail -n 2 || true
          grep -E "Test Case '.*' failed" full.log | sed -E "s/.*Test Case '-\[GonggiTests\.([A-Za-z0-9_]+) ([A-Za-z0-9_]+)\]' failed.*/\1.\2/" | sort -u > failed_cases.txt
          echo "failing test cases: $(wc -l < failed_cases.txt)"
          cat failed_cases.txt
          exit "${STATUS}"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idle-guard-check-${{ matrix.name }}
          path: |
            build.log
            targeted.log
            full.log
            failed_cases.txt
          if-no-files-found: ignore
          retention-days: 7
