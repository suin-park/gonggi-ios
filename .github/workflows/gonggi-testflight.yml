name: Gonggi TestFlight

# Manual only - never run on push (macOS cost + accidental uploads).
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'CFBundleVersion (CURRENT_PROJECT_VERSION) - must be unique per upload'
        required: true
        default: '1'
        type: string
      marketing_version:
        description: 'CFBundleShortVersionString (MARKETING_VERSION override)'
        required: false
        default: '1.0'
        type: string

concurrency:
  group: gonggi-testflight
  cancel-in-progress: false

env:
  SCHEME: Gonggi
  PROJECT: Gonggi.xcodeproj
  BUNDLE_ID: com.whik.gonggi

jobs:
  testflight:
    name: Archive, sign, and upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set artifact paths
        id: paths
        run: |
          echo "archive_path=${RUNNER_TEMP}/Gonggi.xcarchive" >> "$GITHUB_OUTPUT"
          echo "export_path=${RUNNER_TEMP}/export" >> "$GITHUB_OUTPUT"
          echo "ipa_path=${RUNNER_TEMP}/export/Gonggi.ipa" >> "$GITHUB_OUTPUT"

      - name: Validate required secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          APPLE_DISTRIBUTION_CERT_P12: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          APPLE_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          missing=()
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT \
                      APPLE_DISTRIBUTION_CERT_P12 APPLE_DISTRIBUTION_CERT_PASSWORD \
                      APPLE_PROVISIONING_PROFILE; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing required GitHub secrets: ${missing[*]}"
            echo "Configure repository secrets before running this workflow."
            echo "See docs/CI_AND_TESTFLIGHT.md"
            exit 1
          fi
          echo "All required secrets are present."

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "${XCODE_APP}" ]]; then
            echo "::error::No Xcode.app found on runner"
            exit 1
          fi
          echo "DEVELOPER_DIR=${XCODE_APP}/Contents/Developer" >> "$GITHUB_ENV"
          echo "Using ${XCODE_APP}"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
          test -d "${{ env.PROJECT }}"
          xcodebuild -list -project "${{ env.PROJECT }}"

      - name: Import signing certificate and provisioning profile
        id: signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DISTRIBUTION_CERT_P12: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          APPLE_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="${RUNNER_TEMP}/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT_PATH="${RUNNER_TEMP}/distribution.p12"
          PROFILE_PATH="${RUNNER_TEMP}/Gonggi.mobileprovision"
          PROFILE_PLIST="${RUNNER_TEMP}/profile.plist"

          echo "keychain_path=${KEYCHAIN_PATH}" >> "$GITHUB_OUTPUT"
          echo "keychain_password=${KEYCHAIN_PASSWORD}" >> "$GITHUB_OUTPUT"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

          echo "${APPLE_DISTRIBUTION_CERT_P12}" | tr -d '[:space:]' > "${RUNNER_TEMP}/distribution.b64"
          base64 -D -i "${RUNNER_TEMP}/distribution.b64" -o "${CERT_PATH}"
          security import "${CERT_PATH}" \
            -k "${KEYCHAIN_PATH}" \
            -P "${APPLE_DISTRIBUTION_CERT_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "${KEYCHAIN_PASSWORD}" \
            "${KEYCHAIN_PATH}"

          security list-keychains -d user -s "${KEYCHAIN_PATH}" $(security list-keychains -d user | tr -d '"')

          echo "${APPLE_PROVISIONING_PROFILE}" | tr -d '[:space:]' > "${RUNNER_TEMP}/profile.b64"
          base64 -D -i "${RUNNER_TEMP}/profile.b64" -o "${PROFILE_PATH}"
          security cms -D -i "${PROFILE_PATH}" > "${PROFILE_PLIST}"

          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "${PROFILE_PLIST}")"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "${PROFILE_PLIST}")"
          PROFILE_TEAM="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "${PROFILE_PLIST}")"
          PROFILE_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "${PROFILE_PLIST}" 2>/dev/null || true)"

          if [[ "${PROFILE_TEAM}" != "${APPLE_TEAM_ID}" ]]; then
            echo "::error::Provisioning profile Team ID (${PROFILE_TEAM}) does not match APPLE_TEAM_ID"
            exit 1
          fi

          if [[ -n "${PROFILE_APP_ID}" && "${PROFILE_APP_ID}" != *"${{ env.BUNDLE_ID }}" ]]; then
            echo "::error::Provisioning profile app id (${PROFILE_APP_ID}) does not match bundle ${{ env.BUNDLE_ID }}"
            exit 1
          fi

          mkdir -p "${HOME}/Library/MobileDevice/Provisioning Profiles"
          cp "${PROFILE_PATH}" "${HOME}/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          echo "profile_name=${PROFILE_NAME}" >> "$GITHUB_OUTPUT"
          echo "profile_uuid=${PROFILE_UUID}" >> "$GITHUB_OUTPUT"

          echo "Imported distribution certificate."
          echo "Provisioning profile: ${PROFILE_NAME} (${PROFILE_UUID})"
          security find-identity -v -p codesigning "${KEYCHAIN_PATH}" | grep "Apple Distribution" || {
            echo "::error::Apple Distribution identity not found in keychain"
            exit 1
          }

      - name: Prepare App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.private_keys"
          umask 077
          KEY_FILE="${HOME}/.private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "${ASC_KEY_CONTENT}" > "${KEY_FILE}"
          chmod 600 "${KEY_FILE}"
          test -s "${KEY_FILE}"
          echo "App Store Connect API key file prepared (content not logged)."

      - name: Archive (Release, manual signing)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
          ARCHIVE_PATH: ${{ steps.paths.outputs.archive_path }}
        run: |
          set -euo pipefail
          echo "Building archive - marketing ${MARKETING_VERSION}, build ${BUILD_NUMBER}"
          xcodebuild archive \
            -project "${{ env.PROJECT }}" \
            -scheme "${{ env.SCHEME }}" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "${ARCHIVE_PATH}" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_NAME}" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            MARKETING_VERSION="${MARKETING_VERSION}" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}"

          if [[ ! -d "${ARCHIVE_PATH}" ]]; then
            echo "::error::Archive not found at ${ARCHIVE_PATH}"
            exit 1
          fi
          echo "Archive created successfully."

      - name: Export IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
          ARCHIVE_PATH: ${{ steps.paths.outputs.archive_path }}
          EXPORT_PATH: ${{ steps.paths.outputs.export_path }}
          IPA_PATH: ${{ steps.paths.outputs.ipa_path }}
        run: |
          set -euo pipefail
          EXPORT_OPTS="${RUNNER_TEMP}/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" "${EXPORT_OPTS}"
          /usr/libexec/PlistBuddy -c "Add :teamID string ${APPLE_TEAM_ID}" "${EXPORT_OPTS}"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" "${EXPORT_OPTS}"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "${EXPORT_OPTS}"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:${{ env.BUNDLE_ID }} string ${PROFILE_NAME}" "${EXPORT_OPTS}"
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" "${EXPORT_OPTS}"

          mkdir -p "${EXPORT_PATH}"
          xcodebuild -exportArchive \
            -archivePath "${ARCHIVE_PATH}" \
            -exportPath "${EXPORT_PATH}" \
            -exportOptionsPlist "${EXPORT_OPTS}"

          if [[ ! -f "${IPA_PATH}" ]]; then
            echo "::error::IPA not found at ${IPA_PATH}"
            ls -la "${EXPORT_PATH}" || true
            exit 1
          fi
          echo "IPA exported: $(du -h "${IPA_PATH}" | cut -f1)"

      - name: Preflight validate IPA
        env:
          IPA_PATH: ${{ steps.paths.outputs.ipa_path }}
        run: |
          set -euo pipefail
          python3 scripts/validate-ipa-preflight.py "${IPA_PATH}"

      - name: Upload to App Store Connect
        id: upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          IPA_PATH: ${{ steps.paths.outputs.ipa_path }}
        run: |
          set -euo pipefail
          bash scripts/upload-to-asc.sh "${IPA_PATH}"

      - name: Summary
        if: success() && steps.upload.outcome == 'success'
        run: |
          {
            echo "## TestFlight upload succeeded"
            echo ""
            echo "- **Bundle ID:** ${{ env.BUNDLE_ID }}"
            echo "- **Marketing version:** ${{ inputs.marketing_version }}"
            echo "- **Build number:** ${{ inputs.build_number }}"
            echo "- **Profile:** ${{ steps.signing.outputs.profile_name }}"
            echo ""
            echo "Check [App Store Connect](https://appstoreconnect.apple.com/) - TestFlight for processing status."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup signing artifacts
        if: always()
        env:
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ARCHIVE_PATH: ${{ steps.paths.outputs.archive_path }}
          EXPORT_PATH: ${{ steps.paths.outputs.export_path }}
        run: |
          set +e
          if [[ -n "${KEYCHAIN_PATH:-}" && -f "${KEYCHAIN_PATH}" ]]; then
            security delete-keychain "${KEYCHAIN_PATH}" 2>/dev/null || true
          fi
          rm -f "${RUNNER_TEMP}/distribution.p12" "${RUNNER_TEMP}/distribution.b64" "${RUNNER_TEMP}/profile.b64" 2>/dev/null || true
          rm -f "${RUNNER_TEMP}/Gonggi.mobileprovision" 2>/dev/null || true
          rm -f "${RUNNER_TEMP}/profile.plist" 2>/dev/null || true
          rm -f "${RUNNER_TEMP}/ExportOptions.plist" 2>/dev/null || true
          if [[ -n "${ASC_KEY_ID:-}" ]]; then
            rm -f "${HOME}/.private_keys/AuthKey_${ASC_KEY_ID}.p8" 2>/dev/null || true
          fi
          rm -rf "${EXPORT_PATH}" 2>/dev/null || true
          rm -rf "${ARCHIVE_PATH}" 2>/dev/null || true
