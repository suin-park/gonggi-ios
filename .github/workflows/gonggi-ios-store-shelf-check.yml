name: Gonggi iOS store-shelf check

# Validation of branch feat/store-shelf-record-entry: Linux pure-logic tests, then a simulator compile and the unit
# tests. No archive, export, TestFlight, ASC upload and no build-number change. The OpenCV xcframework comes from the
# main-branch cache; a cache miss fails the run instead of rebuilding OpenCV.
on:
  workflow_dispatch:
  push:
    branches: [feat/store-shelf-record-entry]
    paths:
      - ".github/workflows/gonggi-ios-store-shelf-check.yml"
      - "Gonggi/Features/StoreShelf/**"
      - "Gonggi/Features/Capture/RecordHomeView.swift"
      - "Gonggi/Features/Capture/CaptureContainerView.swift"
      - "GonggiTests/StoreShelf*.swift"
      - "project.yml"
      - "Tools/StoreShelfLogicCheck/**"

permissions:
  contents: read

concurrency:
  group: gonggi-ios-store-shelf-check-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: Gonggi.xcodeproj
  SCHEME: Gonggi
  OPENCV_VERSION: "4.10.0"

jobs:
  logic:
    name: Pure logic (Swift on Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:5.9-jammy
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        shell: bash
        run: |
          set -euo pipefail
          W=/tmp/pkg
          mkdir -p "$W/Sources/Gonggi" "$W/Tests/GonggiTests"
          cp Tools/StoreShelfLogicCheck/Package.swift "$W/"
          cp Gonggi/Features/StoreShelf/Core/*.swift "$W/Sources/Gonggi/"
          cp GonggiTests/StoreShelfCoreTests*.swift "$W/Tests/GonggiTests/"
          cd "$W" && swift test 2>&1 | tee /tmp/logic.log
          grep -E "Executed [0-9]+ tests" /tmp/logic.log | tail -n 1

  ios:
    name: Simulator build and unit tests
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Restore OpenCV xcframework (cache only)
        uses: actions/cache/restore@v4
        with:
          path: Vendor/OpenCV/opencv2.xcframework
          key: opencv-${{ env.OPENCV_VERSION }}-ios17-arm64-simarm64-minimal-v1
          fail-on-cache-miss: true

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)"
          echo "DEVELOPER_DIR=${XCODE_APP}/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          git rev-parse HEAD

      - name: Install XcodeGen and generate project
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      - name: Resolve simulator
        id: sim
        run: |
          set -euo pipefail
          UDID="$(python3 <<'PY'
          import json, subprocess, sys
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"], text=True))
          for rt in sorted([k for k in data.get("devices", {}) if "iOS" in k], reverse=True):
              ds = [d for d in data["devices"][rt] if d.get("isAvailable") and "iPhone" in d.get("name", "")]
              ds.sort(key=lambda d: d.get("name", ""))
              if ds:
                  print(ds[0]["udid"]); sys.exit(0)
          sys.exit(1)
          PY
          )"
          echo "udid=${UDID}" >> "$GITHUB_OUTPUT"

      - name: Build for testing (compile app and tests)
        run: |
          set -euo pipefail
          set +e
          xcodebuild build-for-testing \
            -project "${PROJECT}" -scheme "${SCHEME}" -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO EXCLUDED_ARCHS=x86_64 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          set -e
          grep -E "error:|fatal error:|undefined symbol" build.log | tail -n 80 || true
          exit "${STATUS}"

      - name: Boot simulator
        run: xcrun simctl boot "${{ steps.sim.outputs.udid }}" 2>/dev/null || true

      - name: Store-shelf and record-tab tests
        run: |
          set -euo pipefail
          set +e
          xcodebuild test-without-building \
            -project "${PROJECT}" -scheme "${SCHEME}" -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -only-testing:GonggiTests/StoreShelfTests \
            -only-testing:GonggiTests/StoreShelfCoreTests \
            -only-testing:GonggiTests/StoreShelfCoreTests2 \
            -only-testing:GonggiTests/StoreShelfCoreTests3 \
            -only-testing:GonggiTests/StoreShelfCoreTests4 \
            -only-testing:GonggiTests/StoreShelfCoreTests5 \
            -only-testing:GonggiTests/StoreShelfCoreTests6 \
            -only-testing:GonggiTests/StoreShelfCoreTests7 \
            -only-testing:GonggiTests/StoreShelfCoreTests8 \
            -only-testing:GonggiTests/StoreShelfCoreTests9 \
            -only-testing:GonggiTests/StoreShelfAnalysisTraceTests \
            -only-testing:GonggiTests/StoreShelfApproachTests \
            -only-testing:GonggiTests/StoreShelfShortFlowTests \
            -only-testing:GonggiTests/StoreShelfServerSplitTests \
            -only-testing:GonggiTests/StoreShelfAutoCaptureTests \
            -only-testing:GonggiTests/ShelfRecognitionFixtureTests \
            -only-testing:GonggiTests/RecordHomeTests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee store-tests.log
          STATUS=${PIPESTATUS[0]}
          set -e
          grep -E "Test Suite '.*' (passed|failed)|error:|failed \(|Executed [0-9]+ tests|skipped|SHELF_" store-tests.log | tail -n 60 || true
          exit "${STATUS}"

      - name: Full GonggiTests (informational)
        if: always()
        continue-on-error: true
        run: |
          set +e
          xcodebuild test-without-building \
            -project "${PROJECT}" -scheme "${SCHEME}" -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -only-testing:GonggiTests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee full.log
          STATUS=${PIPESTATUS[0]}
          grep -E "Executed [0-9]+ tests, with" full.log | tail -n 2 || true
          grep -E "Test Case '.*' failed" full.log | sed -E "s/.*Test Case '-\[GonggiTests\.([A-Za-z0-9_]+) ([A-Za-z0-9_]+)\]' failed.*/\1.\2/" | sort -u > failed_cases.txt
          echo "failing test cases: $(wc -l < failed_cases.txt)"
          cat failed_cases.txt
          exit "${STATUS}"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-shelf-check-logs
          path: |
            build.log
            store-tests.log
            full.log
            failed_cases.txt
          if-no-files-found: ignore
          retention-days: 7
