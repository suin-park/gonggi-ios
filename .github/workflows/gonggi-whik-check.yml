name: Gonggi WHIK check

# feat/whik-3d-scanner 전용: 컴파일 + 관련 단위 테스트(기존 실패 목록 허용) + 시뮬레이터 화면 캡처(목업 데이터만).
# 서명·아카이브·업로드 없음. TestFlight는 gonggi-testflight.yml이 따로 담당한다.
on:
  push:
    branches:
      - feat/whik-3d-scanner
    paths:
      - 'Gonggi/**'
      - 'GonggiTests/**'
      - 'GonggiUIShots/**'
      - 'project.yml'
      - '.github/workflows/gonggi-whik-check.yml'

concurrency:
  group: gonggi-whik-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT: Gonggi.xcodeproj
  OPENCV_VERSION: "4.10.0"

jobs:
  check:
    name: Build, tests and screenshots
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache OpenCV xcframework
        id: opencv-cache
        uses: actions/cache@v4
        with:
          path: Vendor/OpenCV/opencv2.xcframework
          key: opencv-${{ env.OPENCV_VERSION }}-ios17-arm64-simarm64-minimal-v1

      - name: Ensure OpenCV xcframework
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          chmod +x scripts/build_opencv_xcframework.sh scripts/ensure_opencv_xcframework.sh
          ./scripts/ensure_opencv_xcframework.sh

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)"
          echo "DEVELOPER_DIR=${XCODE_APP}/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Fetch Depth Anything V2 Small (Core ML, sha256 pinned)
        run: bash scripts/fetch-depth-model.sh

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
          test -d "${{ env.PROJECT }}"

      - name: Unit tests (WHIK shell + capture)
        run: |
          set -euo pipefail
          pick() {
            xcrun simctl list devices available -j | python3 -c "
          import json, sys
          want = sys.argv[1]
          data = json.load(sys.stdin)['devices']
          for rt in sorted([k for k in data if 'iOS' in k], reverse=True):
              for d in data[rt]:
                  if d.get('isAvailable') and d['name'] == want:
                      print(d['udid']); sys.exit(0)
          sys.exit(1)" "$1"
          }
          UDID="$(pick 'iPhone 16 Pro' || pick 'iPhone 16' || pick 'iPhone 15 Pro')"
          xcrun simctl boot "${UDID}" 2>/dev/null || true
          set +e
          xcodebuild test \
            -project "${{ env.PROJECT }}" -scheme Gonggi -configuration Debug \
            -destination "platform=iOS Simulator,id=${UDID}" -derivedDataPath DD \
            -only-testing:GonggiTests/WhikShellTests \
            -only-testing:GonggiTests/HighResStillCaptureTests \
            -only-testing:GonggiTests/MotionBlurCaptureTests \
            -only-testing:GonggiTests/GuidanceRuleEngineTests \
            -only-testing:GonggiTests/CaptureGapModelTests \
            -only-testing:GonggiTests/KeyframeSelectorLogicTests \
            -only-testing:GonggiTests/SpatialCapturePackageTests \
            -only-testing:GonggiTests/SpatialRecordFormalFeatureTests \
            -only-testing:GonggiTests/SurfaceCoverageModelTests \
            -only-testing:GonggiTests/PrimaryGuidancePresenterTests \
            -only-testing:GonggiTests/SpaceCaptureMetadataTests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee xcodebuild-unit.log
          STATUS=${PIPESTATUS[0]}
          set -e
          grep -E "error:|failed \(" xcodebuild-unit.log | head -n 80 || true
          grep -E "Executed [0-9]+ tests" xcodebuild-unit.log | tail -n 2 || true
          echo "xcodebuild exit=${STATUS} (known failures make this non-zero; the gate below decides)"
          grep -oE "GonggiTests\.[A-Za-z0-9_]+ [A-Za-z0-9_]+\]' failed" xcodebuild-unit.log \
            | awk '{ sub(/^GonggiTests\./, "", $1); sub(/\].*/, "", $2); print $1 "/" $2 }' | sort -u > failed.txt || true
          NEW=0
          while read -r t; do
            if grep -qxF "$t" ci/known_test_failures.txt; then echo "known: $t"; else echo "NEW FAILURE: $t"; NEW=1; fi
          done < failed.txt
          if ! grep -qE "Executed [0-9]+ tests" xcodebuild-unit.log; then echo "tests did not run (build error or crash)"; exit 1; fi
          exit "${NEW}"

      - name: Screenshots (SE, 16 Plus ≈ 14 Plus, 16 Pro)
        if: always()
        run: |
          set -uo pipefail
          mkdir -p shots
          pick() {
            xcrun simctl list devices available -j | python3 -c "
          import json, sys
          want = sys.argv[1]
          data = json.load(sys.stdin)['devices']
          for rt in sorted([k for k in data if 'iOS' in k], reverse=True):
              for d in data[rt]:
                  if d.get('isAvailable') and d['name'] == want:
                      print(d['udid']); sys.exit(0)
          sys.exit(1)" "$1"
          }
          FAIL=0
          for NAME in "iPhone SE (3rd generation)" "iPhone 16 Plus" "iPhone 16 Pro"; do
            UDID="$(pick "$NAME" || true)"
            if [ -z "$UDID" ]; then echo "no simulator: $NAME"; continue; fi
            xcrun simctl boot "$UDID" 2>/dev/null || true
            xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
            TEST_RUNNER_SHOTS_DIR="$PWD/shots" xcodebuild test \
              -project "${{ env.PROJECT }}" -scheme GonggiUIShots -configuration Debug \
              -destination "platform=iOS Simulator,id=${UDID}" -derivedDataPath DD \
              CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" \
              > "shots/xcodebuild-$(echo $NAME | tr -d ' ()').log" 2>&1 || FAIL=1
            grep -E "Test Case .*(passed|failed)|error:" "shots/xcodebuild-$(echo $NAME | tr -d ' ()').log" | tail -n 30 || true
            xcrun simctl shutdown "$UDID" || true
          done
          echo "screenshots: $(ls shots/*.png 2>/dev/null | wc -l | tr -d ' ')"
          exit "$FAIL"

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whik-screenshots
          path: |
            shots/**
            xcodebuild-unit.log
          retention-days: 14
