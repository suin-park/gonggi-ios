name: Gonggi iOS Differential Regression

# Compare full GonggiTests on release base (2.0/33 line) vs feature head.
# Fails only on NEW regressions (failed on head, passed on base).
# No archive / signing / TestFlight / build-number bump.
on:
  push:
    branches:
      - feature/gonggi-partner-catalog-ios
    paths:
      - 'Gonggi/**'
      - 'GonggiTests/**'
      - 'project.yml'
      - 'scripts/compare-gonggi-test-failures.py'
      - '.github/workflows/gonggi-ios-differential-regression.yml'
  pull_request:
    branches:
      - design/brand-redesign-v1
    paths:
      - 'Gonggi/**'
      - 'GonggiTests/**'
      - 'project.yml'
      - 'scripts/compare-gonggi-test-failures.py'
      - '.github/workflows/gonggi-ios-differential-regression.yml'
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'Base SHA (default: design/brand-redesign-v1 tip / 2.0(33) source)'
        required: false
        default: '1bf88b2d70018eae6461dfa4124dd5e292298f23'
      head_sha:
        description: 'Head SHA (default: current checkout SHA)'
        required: false
        default: ''

concurrency:
  group: gonggi-ios-diff-reg-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SCHEME: Gonggi
  PROJECT: Gonggi.xcodeproj
  OPENCV_VERSION: "4.10.0"
  # Pin to match Feature CI success environment (Xcode 16.4 / iOS 18.5 sim).
  XCODE_SELECT: /Applications/Xcode_16.4.app/Contents/Developer
  BASE_SHA_DEFAULT: 1bf88b2d70018eae6461dfa4124dd5e292298f23

jobs:
  prepare-opencv:
    name: Prepare OpenCV xcframework
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Cache OpenCV xcframework
        id: opencv-cache
        uses: actions/cache@v4
        with:
          path: Vendor/OpenCV/opencv2.xcframework
          key: opencv-${{ env.OPENCV_VERSION }}-ios17-arm64-simarm64-minimal-v1
      - name: Ensure OpenCV xcframework
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          chmod +x scripts/build_opencv_xcframework.sh scripts/ensure_opencv_xcframework.sh
          ./scripts/ensure_opencv_xcframework.sh
      - uses: actions/upload-artifact@v4
        with:
          name: opencv2-xcframework-diff
          path: Vendor/OpenCV/opencv2.xcframework
          if-no-files-found: error
          retention-days: 3

  test-ref:
    name: Full GonggiTests (${{ matrix.label }})
    needs: prepare-opencv
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: base
            sha_source: base
          - label: head
            sha_source: head
    steps:
      - name: Resolve SHA
        id: ref
        run: |
          set -euo pipefail
          if [[ "${{ matrix.sha_source }}" == "base" ]]; then
            SHA="${{ github.event.inputs.base_sha }}"
            if [[ -z "${SHA}" ]]; then
              SHA="${{ env.BASE_SHA_DEFAULT }}"
            fi
          else
            SHA="${{ github.event.inputs.head_sha }}"
            if [[ -z "${SHA}" ]]; then
              SHA="${{ github.sha }}"
            fi
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Testing ${{ matrix.label }} @ ${SHA}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.sha }}
          fetch-depth: 0

      - name: Guard build number 33 (no bump)
        run: |
          set -euo pipefail
          grep -q 'CURRENT_PROJECT_VERSION: "33"' project.yml
          grep -q 'MARKETING_VERSION: "2.0"' project.yml

      - name: Restore OpenCV cache
        id: opencv-cache
        uses: actions/cache@v4
        with:
          path: Vendor/OpenCV/opencv2.xcframework
          key: opencv-${{ env.OPENCV_VERSION }}-ios17-arm64-simarm64-minimal-v1

      - name: Download OpenCV if needed
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: opencv2-xcframework-diff
          path: /tmp/opencv-artifact

      - name: Install OpenCV
        run: |
          set -euo pipefail
          DEST="Vendor/OpenCV/opencv2.xcframework"
          mkdir -p Vendor/OpenCV
          if [[ -f "${DEST}/Info.plist" ]]; then
            echo "cached"
          else
            FOUND="$(find /tmp/opencv-artifact -type d -name 'opencv2.xcframework' | head -n 1 || true)"
            rm -rf "${DEST}"
            cp -R "${FOUND}" "${DEST}"
          fi
          test -f "${DEST}/Info.plist"

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode_16.4.app ]]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer" >> "$GITHUB_ENV"
          elif [[ -d /Applications/Xcode.app ]]; then
            echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> "$GITHUB_ENV"
          else
            XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)"
            echo "DEVELOPER_DIR=${XCODE_APP}/Contents/Developer" >> "$GITHUB_ENV"
          fi
          xcodebuild -version
          sw_vers

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate project
        run: |
          set -euo pipefail
          xcodegen generate
          test -d "${{ env.PROJECT }}"

      - name: Resolve Simulator (iOS 18.5 preferred)
        id: sim
        run: |
          set -euo pipefail
          UDID="$(python3 <<'PY'
          import json, subprocess, sys
          out = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"], text=True)
          data = json.loads(out)
          # Prefer iOS 18.5 runtime, then any iOS; prefer iPhone 16/15
          runtimes = list(data.get("devices", {}).keys())
          preferred_rt = [r for r in runtimes if "18.5" in r] or sorted(
              [r for r in runtimes if "iOS" in r], reverse=True
          )
          for rt in preferred_rt:
              devices = data["devices"][rt]
              phones = [d for d in devices if d.get("isAvailable") and "iPhone" in d.get("name", "")]
              phones.sort(key=lambda d: d.get("name", ""))
              for d in phones:
                  if any(x in d.get("name", "") for x in ("iPhone 16", "iPhone 15", "iPhone 14")):
                      print(d["udid"]); sys.exit(0)
              if phones:
                  print(phones[0]["udid"]); sys.exit(0)
          sys.exit(1)
          PY
          )"
          echo "udid=${UDID}" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "${UDID}" || true

      - name: CatalogModelsTests (head only, hard gate)
        if: matrix.label == 'head'
        run: |
          set -euo pipefail
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" 2>/dev/null || true
          set +e
          xcodebuild test \
            -project "${{ env.PROJECT }}" \
            -scheme "${{ env.SCHEME }}" \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -only-testing:GonggiTests/CatalogModelsTests \
            ARCHS=arm64 EXCLUDED_ARCHS=x86_64 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee catalog-gate.log
          STATUS=${PIPESTATUS[0]}
          set -e
          exit "${STATUS}"

      - name: Full GonggiTests
        id: full
        run: |
          set -euo pipefail
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" 2>/dev/null || true
          set +e
          xcodebuild test \
            -project "${{ env.PROJECT }}" \
            -scheme "${{ env.SCHEME }}" \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -only-testing:GonggiTests \
            ARCHS=arm64 EXCLUDED_ARCHS=x86_64 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -resultBundlePath "GonggiTests-${{ matrix.label }}.xcresult" \
            2>&1 | tee "xcodebuild-${{ matrix.label }}.log"
          STATUS=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${STATUS}" >> "$GITHUB_OUTPUT"
          # Always extract failures for comparison (non-zero is expected on baseline).
          python3 - <<'PY'
          import re, pathlib, os
          label = os.environ["LABEL"]
          log = pathlib.Path(f"xcodebuild-{label}.log")
          text = log.read_text(encoding="utf-8", errors="replace")
          pat = re.compile(r"Test Case '-\[(?P<suite>[A-Za-z0-9_.]+) (?P<name>[A-Za-z0-9_]+)]' failed")
          ids = sorted({f"{m.group('suite')}/{m.group('name')}" for m in pat.finditer(text)})
          pathlib.Path(f"failures-{label}.txt").write_text("\n".join(ids) + ("\n" if ids else ""), encoding="utf-8")
          print(f"{label}: {len(ids)} failures")
          for i in ids:
              print(i)
          PY
        env:
          LABEL: ${{ matrix.label }}

      - name: Upload ref artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diff-ref-${{ matrix.label }}
          path: |
            failures-${{ matrix.label }}.txt
            xcodebuild-${{ matrix.label }}.log
            GonggiTests-${{ matrix.label }}.xcresult
            catalog-gate.log
          if-no-files-found: warn
          retention-days: 14

  compare:
    name: Differential compare (fail on new regressions)
    needs: test-ref
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/compare-gonggi-test-failures.py
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: diff-ref-base
          path: base-art

      - uses: actions/download-artifact@v4
        with:
          name: diff-ref-head
          path: head-art

      - name: Compare failure sets
        id: cmp
        run: |
          set -euo pipefail
          python3 scripts/compare-gonggi-test-failures.py \
            --base-failures base-art/failures-base.txt \
            --head-failures head-art/failures-head.txt \
            --out-json differential-report.json \
            --out-summary differential-summary.md
          {
            echo "## Differential regression gate"
            cat differential-summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload differential report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: differential-regression-report
          path: |
            differential-report.json
            differential-summary.md
            base-art/failures-base.txt
            head-art/failures-head.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Fail if new regressions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys
          r = json.load(open("differential-report.json", encoding="utf-8"))
          print(json.dumps(r, indent=2))
          if not r.get("pass"):
              print("::error::New regressions detected vs 2.0(33) base; release blocked.")
              sys.exit(1)
          print("No new regressions vs base.")
          PY
