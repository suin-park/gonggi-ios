name: Gonggi iOS CI

on:
  push:
    branches: [main]
    paths:
      - 'Gonggi/**'
      - 'GonggiTests/**'
      - 'project.yml'
      - 'scripts/**'
      - 'docs/**'
      - 'Vendor/OpenCV/**'
      - 'third_party/**'
      - 'NOTICE'
      - '.github/workflows/gonggi-ios-ci.yml'
  pull_request:
    paths:
      - 'Gonggi/**'
      - 'GonggiTests/**'
      - 'project.yml'
      - 'scripts/**'
      - 'Vendor/OpenCV/**'
      - 'third_party/**'
      - '.github/workflows/gonggi-ios-ci.yml'

concurrency:
  group: gonggi-ios-ci-${{ github.ref }}
  # OpenCV xcframework build can take 30–90+ minutes; do not cancel in-flight prepares.
  cancel-in-progress: false

env:
  SCHEME: Gonggi
  PROJECT: Gonggi.xcodeproj
  OPENCV_VERSION: "4.10.0"

jobs:
  prepare-opencv:
    name: Prepare OpenCV xcframework
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache OpenCV xcframework
        id: opencv-cache
        uses: actions/cache@v4
        with:
          path: Vendor/OpenCV/opencv2.xcframework
          key: opencv-${{ env.OPENCV_VERSION }}-ios17-arm64-simarm64-minimal-v1

      - name: Ensure OpenCV xcframework
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          chmod +x scripts/build_opencv_xcframework.sh scripts/ensure_opencv_xcframework.sh
          ./scripts/ensure_opencv_xcframework.sh

      - name: Upload OpenCV xcframework
        uses: actions/upload-artifact@v4
        with:
          name: opencv2-xcframework
          path: Vendor/OpenCV/opencv2.xcframework
          if-no-files-found: error
          retention-days: 7

  build-and-test:
    name: Simulator build & unit tests
    needs: prepare-opencv
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download OpenCV xcframework
        uses: actions/download-artifact@v4
        with:
          name: opencv2-xcframework
          path: Vendor/OpenCV

      - name: Verify OpenCV layout
        run: |
          set -euo pipefail
          # Normalize nested download layouts from upload-artifact.
          if [[ ! -f Vendor/OpenCV/opencv2.xcframework/Info.plist ]]; then
            INNER="$(find Vendor/OpenCV -type d -name 'opencv2.xcframework' | head -n 1)"
            if [[ -n "${INNER}" && "${INNER}" != "Vendor/OpenCV/opencv2.xcframework" ]]; then
              rm -rf /tmp/opencv2.xcframework
              mv "${INNER}" /tmp/opencv2.xcframework
              rm -rf Vendor/OpenCV/opencv2.xcframework
              mkdir -p Vendor/OpenCV
              mv /tmp/opencv2.xcframework Vendor/OpenCV/opencv2.xcframework
            fi
          fi
          test -f Vendor/OpenCV/opencv2.xcframework/Info.plist
          ls -la Vendor/OpenCV/opencv2.xcframework

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "${XCODE_APP}" ]]; then
            echo "No Xcode.app found on runner"
            exit 1
          fi
          echo "DEVELOPER_DIR=${XCODE_APP}/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          xcodebuild -showsdks

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: gonggi-ios-deriveddata-${{ hashFiles('Gonggi/**/*.swift', 'Gonggi/**/*.{h,mm,m}', 'GonggiTests/**/*.swift', 'Gonggi/Resources/Assets.xcassets/**', 'project.yml', 'Vendor/OpenCV/VERSION') }}
          restore-keys: |
            gonggi-ios-deriveddata-

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
          test -d "${{ env.PROJECT }}"
          xcodebuild -list -project "${{ env.PROJECT }}"

      - name: Validate AppIcon sources
        run: python3 scripts/validate-app-icon-sources.py

      - name: Resolve iOS Simulator destination
        id: sim
        run: |
          set -euo pipefail
          UDID="$(python3 <<'PY'
          import json, subprocess, sys
          out = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"], text=True)
          data = json.loads(out)
          runtimes = sorted([k for k in data.get("devices", {}) if "iOS" in k], reverse=True)
          for rt in runtimes:
              devices = data["devices"][rt]
              preferred = [d for d in devices if d.get("isAvailable") and "iPhone" in d.get("name", "")]
              preferred.sort(key=lambda d: d.get("name", ""))
              for d in preferred:
                  name = d.get("name", "")
                  if any(x in name for x in ("iPhone 15", "iPhone 16", "iPhone 14", "iPhone SE")):
                      print(d["udid"])
                      sys.exit(0)
              for d in preferred:
                  print(d["udid"])
                  sys.exit(0)
          sys.exit(1)
          PY
          )"
          echo "udid=${UDID}" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "${UDID}" || true

      - name: Build (iOS Simulator, unsigned)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "${{ env.PROJECT }}" \
            -scheme "${{ env.SCHEME }}" \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Release build (iOS Simulator, unsigned)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "${{ env.PROJECT }}" \
            -scheme "${{ env.SCHEME }}" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Report OpenCV binary size delta
        run: |
          set -euo pipefail
          APP_PATH="$(find "${HOME}/Library/Developer/Xcode/DerivedData" -type d -name 'Gonggi.app' -path '*/Release-iphonesimulator/*' -print -quit)"
          echo "Release app: ${APP_PATH}"
          du -sh "${APP_PATH}" || true
          du -sh Vendor/OpenCV/opencv2.xcframework || true

      - name: Preflight validate Release app bundle
        run: |
          set -euo pipefail
          APP_PATH="$(find "${HOME}/Library/Developer/Xcode/DerivedData" -type d -name 'Gonggi.app' -path '*/Release-iphonesimulator/*' -print -quit)"
          if [[ -z "${APP_PATH}" ]]; then
            echo "::error::Release Gonggi.app not found in DerivedData"
            exit 1
          fi
          echo "Validating ${APP_PATH}"
          python3 scripts/validate-app-bundle-preflight.py "${APP_PATH}"

      - name: Boot simulator
        run: xcrun simctl boot "${{ steps.sim.outputs.udid }}" 2>/dev/null || true

      - name: Unit tests (iOS Simulator)
        run: |
          set -euo pipefail
          xcodebuild test \
            -project "${{ env.PROJECT }}" \
            -scheme "${{ env.SCHEME }}" \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -only-testing:GonggiTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -resultBundlePath TestResults.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gonggi-ios-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
