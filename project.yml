name: Gonggi
options:
  bundleIdPrefix: com.whik
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Gonggi:
    type: application
    platform: iOS
    sources:
      - path: Gonggi
        excludes:
          - "**/*.md"
    resources:
      - path: NOTICE
      - path: third_party/opencv/LICENSE
    dependencies:
      - framework: Vendor/OpenCV/opencv2.xcframework
        embed: false
      - sdk: libc++.tbd
      - sdk: Accelerate.framework
    settings:
      base:
        OTHER_LDFLAGS: "$(inherited) -framework opencv2 -lz"
        OTHER_CPLUSPLUSFLAGS: "$(inherited) -frtti -fexceptions"
        GCC_ENABLE_CPP_EXCEPTIONS: YES
        GCC_ENABLE_CPP_RTTI: YES
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        CLANG_CXX_LIBRARY: libc++
        CLANG_ENABLE_MODULES: YES
        ENABLE_BITCODE: NO
        # macos-15 / Apple Silicon CI: OpenCV minimal xcframework is arm64(+sim arm64) only.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        ONLY_ACTIVE_ARCH: NO
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/OpenCV"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Gonggi/Capture/Quick360/Engine/OpenCV"
        SWIFT_OBJC_BRIDGING_HEADER: Gonggi/Capture/Quick360/Engine/OpenCV/Gonggi-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: 공기
        INFOPLIST_KEY_NSCameraUsageDescription: 파노라마·공간 기록을 위해 카메라가 필요합니다.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.whik.gonggi
    info:
      path: Gonggi/Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        NSCameraUsageDescription: 파노라마·공간 기록을 위해 카메라가 필요합니다.
        NSPhotoLibraryAddUsageDescription: 촬영한 공간을 저장합니다.

  GonggiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GonggiTests
    dependencies:
      - target: Gonggi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whik.gonggi.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Gonggi.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Gonggi"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Gonggi:
    build:
      targets:
        Gonggi: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GonggiTests
    profile:
      config: Release
    analyze:
      config: Debug
