name: Gonggi
options:
  bundleIdPrefix: com.whik
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "3.1"
    CURRENT_PROJECT_VERSION: "1"
    GONGGI_BUILD_SHA: "local"
    # API server for this build. Production unless the TestFlight workflow passes a staging URL
    # (product 3DGS pre-release builds must not talk to the production server).
    GONGGI_API_BASE_URL: "https://www.3d-locker.com"
    # 매장 routes only. Empty = same server as GONGGI_API_BASE_URL. The TestFlight workflow sets it for builds that
    # keep the production login but use a separate store server.
    GONGGI_STORE_API_BASE_URL: ""
    # 기록하기 › 실험(센서 검사) 메뉴. YES면 보인다. 정식 배포 빌드에서는 NO로 바꾼다(원격 설정·서버 없음).
    GONGGI_SENSOR_EXPERIMENTS: "YES"

configs:
  Debug: debug
  Release: release

# Single source for Google iOS OAuth client id (Debug + Release).
configFiles:
  Debug: Config/Auth.xcconfig
  Release: Config/Auth.xcconfig

targets:
  Gonggi:
    type: application
    platform: iOS
    sources:
      - path: Gonggi
        excludes:
          - "**/*.md"
    resources:
      - path: NOTICE
      - path: third_party/opencv/LICENSE
      - path: Gonggi/Resources/Welcome/WelcomeLatLongSample_1774x887.jpg
    dependencies:
      - framework: Vendor/OpenCV/opencv2.xcframework
        embed: false
      - sdk: libc++.tbd
      - sdk: Accelerate.framework
    configFiles:
      Debug: Config/Auth.xcconfig
      Release: Config/Auth.xcconfig
    settings:
      base:
        OTHER_LDFLAGS: "$(inherited) -framework opencv2 -lz"
        OTHER_CPLUSPLUSFLAGS: "$(inherited) -frtti -fexceptions"
        GCC_ENABLE_CPP_EXCEPTIONS: YES
        GCC_ENABLE_CPP_RTTI: YES
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        CLANG_CXX_LIBRARY: libc++
        CLANG_ENABLE_MODULES: YES
        ENABLE_BITCODE: NO
        # macos-15 / Apple Silicon CI: OpenCV minimal xcframework is arm64(+sim arm64) only.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        ONLY_ACTIVE_ARCH: NO
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/OpenCV"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Gonggi/Capture/Quick360/Engine/OpenCV"
        SWIFT_OBJC_BRIDGING_HEADER: Gonggi/Capture/Quick360/Engine/OpenCV/Gonggi-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: WHIK
        INFOPLIST_KEY_NSCameraUsageDescription: WHIK uses the camera to capture spaces and objects in 3D.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: WHIK saves where a capture was taken.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: WHIK can record the sound of a space with your capture.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.whik.gonggi
        CODE_SIGN_ENTITLEMENTS: Gonggi/Resources/Gonggi.entitlements
    entitlements:
      path: Gonggi/Resources/Gonggi.entitlements
      properties:
        aps-environment: production
        com.apple.developer.applesignin:
          - Default
    info:
      path: Gonggi/Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # 설치된 앱 이름. xcodegen이 이 속성으로 Info.plist를 새로 쓰므로 여기에 있어야 최종 아카이브에 들어간다.
        # Home-screen name. The store listing name is "WHIK: 3D Scanner" (App Store Connect), not this key.
        CFBundleDisplayName: WHIK
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - ko
          - ja
          - zh-Hans
        GonggiBuildSHA: $(GONGGI_BUILD_SHA)
        GonggiAPIBaseURL: $(GONGGI_API_BASE_URL)
        GonggiStoreAPIBaseURL: $(GONGGI_STORE_API_BASE_URL)
        GonggiSensorExperimentsEnabled: $(GONGGI_SENSOR_EXPERIMENTS)
        # 기록하기 › 실험 › 실시간 공간 생성 V2(서버·학습·모델 없는 온디바이스 표면 지도)가 이 빌드에 들어 있다는 표식. IPA 점검이 확인한다.
        GonggiSurfaceV2Version: "1"
        # 기록하기 › 실험 › 가우시안 최적화(기기 내, 서버 없음)가 이 빌드에 들어 있다는 표식. IPA 점검이 확인한다.
        GonggiGSOptVersion: "1"
        # 기록하기 › 실험 › 실시간 제품 3DGS(기기 내 마스크·최적화, 서버 없음)가 이 빌드에 들어 있다는 표식. IPA 점검이 확인한다.
        GonggiProductGSVersion: "1"
        # 기록하기 › 실험 › 실시간 제품 3DGS의 새 방식(텍스처 스플랫 레이어, .kmots)이 이 빌드에 들어 있다는 표식. IPA 점검이 확인한다.
        GonggiTexLayersVersion: "4"
        NSMotionUsageDescription: WHIK uses motion sensors to guide steady captures.
        # Internal TestFlight ONLY: bake pending-angular-rescue ON into this IPA.
        # Product default in Swift remains OFF when this key is removed/false.
        GonggiPendingAngularRescueDefault: true
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        NSCameraUsageDescription: WHIK uses the camera to capture spaces and objects in 3D.
        NSLocationWhenInUseUsageDescription: WHIK saves where a capture was taken.
        NSMicrophoneUsageDescription: WHIK can record the sound of a space with your capture.
        NSPhotoLibraryAddUsageDescription: WHIK saves captures to your photo library when you choose to.
        # Injected from Config/Auth.xcconfig (Debug + Release) — not hardcoded in Swift.
        GoogleClientID: $(GOOGLE_IOS_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLName: google-oauth
            CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)

  GonggiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GonggiTests
        excludes:
          - "Fixtures/**"
    resources:
      - path: GonggiTests/Fixtures
    dependencies:
      - target: Gonggi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whik.gonggi.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Gonggi.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Gonggi"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # WHIK shell screenshots for design review (scheme GonggiUIShots only; the Gonggi scheme's tests skip it).
  GonggiUIShots:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GonggiUIShots
    dependencies:
      - target: Gonggi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whik.gonggi.uishots
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Gonggi

schemes:
  Gonggi:
    build:
      targets:
        Gonggi: all
    run:
      config: Debug
    test:
      config: Debug
      # Unit tests run the app UI in Korean (saved-language key via the argument domain): most copy tests were
      # written against the Korean strings. WhikShellTests switch languages explicitly.
      commandLineArguments:
        "-whik.language.v1 ko": true
      targets:
        - GonggiTests
    profile:
      config: Release
    analyze:
      config: Debug

  GonggiUIShots:
    build:
      targets:
        Gonggi: all
        GonggiUIShots: [test]
    test:
      config: Debug
      targets:
        - GonggiUIShots
